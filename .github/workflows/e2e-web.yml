name: Web Playwright e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d onda"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/onda?schema=public
      AUTH_ALLOW_DEV_HEADERS: "true"
      WEB_ORIGIN: http://localhost:5173
      SUPABASE_JWT_SECRET: playwright-ci-placeholder
      PLAYWRIGHT_WITH_API: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @onda/web exec playwright install --with-deps chromium

      - name: Run browser e2e
        run: pnpm test:e2e:web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  playwright-web-next:
